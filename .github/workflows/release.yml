name: Release

# Tag-driven, and nothing else.
#
# A release is a decision, not a side effect of merging. Pushing a `v*` tag is
# the decision; this workflow turns it into an installer, a signature and the
# `latest.json` the updater reads. Running on every push to main would publish
# whatever happened to be merged, which for an app a chemist runs mid-experiment
# is not a risk worth taking.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  # The release is created and its assets uploaded with this token.
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Note whether the Android signing key is available
        # A step condition cannot read `secrets` directly — GitHub rejects the
        # workflow at parse time if it tries. Surfacing it as an environment
        # flag is the supported pattern, and it is computed once here rather
        # than repeated in each condition.
        #
        # This exists so a contributor without the key still runs the whole
        # job: the two Android steps are skipped rather than failed, and the
        # asset gate at the end names exactly what is missing.
        shell: bash
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            echo "HAS_ANDROID_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_ANDROID_KEY=false" >> "$GITHUB_ENV"
            echo "::notice::no Android signing key — the APK will be missing from this release"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Install JDK 21
        # Capacitor's generated `capacitor.build.gradle` pins
        # `sourceCompatibility JavaVersion.VERSION_21`, and the runner's
        # preinstalled JDK is 17 — which fails with "invalid source release: 21"
        # several minutes into the Gradle build, after the whole Android
        # toolchain has downloaded.
        #
        # Installed explicitly rather than relying on the runner image, so the
        # version the build needs is stated where it can be read rather than
        # inferred from a machine's defaults.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust
        # Pinned to the same toolchain the local build uses, so the artifact CI
        # produces is the artifact the developer tested.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        # The Tauri build is the slow part — a cold cargo build of the WebView2
        # bindings runs to several minutes. The cache key includes the lockfile
        # so a dependency change invalidates it rather than serving stale
        # artifacts.
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Gate — the same checks a push to main gets
        # A release that fails its own tests is a release nobody can install
        # twice. The web deploy already refuses to publish an untested build;
        # this is the same gate for the installer.
        shell: bash
        run: |
          npm test
          node scripts/check-imports.mjs src
          npm run verify

      - name: Assert the tag matches the version being built
        # The updater compares versions, and a tag that disagrees with
        # `package.json` produces a release the app either never sees or sees
        # forever. Cheaper to fail here than to debug from a user's machine.
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "OK: tag v$TAG matches package.json"

      - name: Check the release notes exist
        # The notes are hand-written Chinese prose in `docs/releases/`, because
        # they are a different document from the English CHANGELOG: the
        # changelog is a terse record for a developer, the release notes are an
        # argument to a chemist about why this version is worth installing.
        #
        # Checked rather than generated. Generating one from the other produced
        # a body that was English prose with a Chinese footer, which is worse
        # than either.
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          F="docs/releases/v${V}.md"
          if [ ! -f "$F" ]; then
            echo "::error::$F is missing — write the release notes before tagging"
            exit 1
          fi
          # A one-line placeholder publishes a release that says nothing.
          if [ "$(wc -c < "$F")" -lt 400 ]; then
            echo "::error::$F is too short to be real release notes"
            exit 1
          fi
          echo "OK: $F"

      - name: Restore the Android signing key
        # Gated on the secret existing, so a fork or a contributor without the
        # key still runs the whole workflow — it just produces an unsigned APK
        # step that is skipped, and the asset gate at the end names what is
        # missing. Failing here instead would make the release job red for
        # everyone who is not the release manager.
        #
        # The key is base64 because GitHub secrets hold text and a keystore is
        # binary. `keystore.properties` is generated rather than stored: it is
        # three lines, and a stored copy is one more thing that can drift from
        # the key it describes.
        if: env.HAS_ANDROID_KEY == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/lab-calc-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=lab-calc-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=labcalc
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "OK: signing key restored"

      - name: Build the Android APK
        # `--no-build` because the Tauri step below builds `dist/` for the same
        # commit; rebuilding it here would be a second build of identical input.
        # Ordered before the Tauri step so the APK is on disk when the asset
        # gate runs.
        if: env.HAS_ANDROID_KEY == 'true'
        shell: bash
        run: |
          npm run build -- --mode desktop
          node scripts/package-android.mjs --release --no-build
          cp android/app/build/outputs/apk/release/app-release.apk \
             "lab-calc-${GITHUB_REF_NAME#v}.apk"

      - name: Build the Electron portable zip
        # No secrets needed — Electron is signed by nobody and distributed as a
        # zip. It is the fallback for a machine without WebView2, which is why
        # it is built even though Tauri is the recommended artifact.
        shell: bash
        run: |
          # The packager assembles the app around a cached Electron runtime
          # rather than downloading one, so a fresh runner has nothing to work
          # with. `electron --version` is what populates the cache.
          #
          # Pinned rather than `@latest`: the packager takes the highest cached
          # version, so `@latest` would silently make CI's artifact a different
          # Electron from the one the release was tested against. Bump this and
          # the local cache together.
          npx --yes electron@44.4.5 --version
          npm run package:desktop -- --no-build --out "$RUNNER_TEMP/electron"
          cd "$RUNNER_TEMP/electron"
          # The packager writes a directory; the README promises a zip.
          7z a "labcalc-v${GITHUB_REF_NAME#v}-win-x64.zip" "labcalc-v${GITHUB_REF_NAME#v}-win-x64" > /dev/null

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The private key, from repository secrets. It is never written into
          # the workflow — a key in the repository is the one thing that would
          # make this whole channel worthless.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # `tauri-action` defaults to `npm run tauri build`, and this repository
          # has no `tauri` script — the local build goes through
          # `scripts/package-tauri.mjs`, which exists to find cargo and to give a
          # useful error when it is missing. Neither is needed here: the
          # toolchain step above puts cargo on the PATH, and this runner has the
          # MSVC linker.
          #
          # The script's only pre-build work is syncing the version into
          # `tauri.conf.json` and `Cargo.toml`, and the gate above now fails the
          # release if they disagree — so nothing is lost by calling the CLI
          # directly, and the frontend build still runs through
          # `beforeBuildCommand`.
          tauriScript: npx tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: 'Lab Calc ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          prerelease: false
          # Without this the release carries no `.sig` and no `latest.json`, and
          # the update endpoint 404s forever while the release itself looks fine.
          includeUpdaterJson: true

      - name: Attach the release notes
        # `tauri-action` writes its own body, so this replaces it after the fact.
        # A draft release is edited rather than published, which is the point of
        # `releaseDraft: true` above: the notes are reviewable before anyone
        # sees the release, and a mistake is fixed by editing the draft rather
        # than by deleting something already published.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes-file "docs/releases/v${GITHUB_REF_NAME#v}.md" --draft

      - name: Upload the Android and Electron artifacts
        # `tauri-action` uploads only what it built. These two are uploaded here,
        # to the draft release it created.
        #
        # A draft is still a release as far as the API is concerned, so
        # `gh release upload` works against it — which is what makes the asset
        # gate below able to run before anything is published.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          # Only what was actually built: the APK step is skipped without the
          # signing secret, and uploading a path that does not exist fails the
          # job with a confusing message rather than naming the real problem.
          files=(lab-calc-*.apk "$RUNNER_TEMP/electron"/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::nothing extra to upload"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

      - name: Assert the release carries what the README promises
        # The install table offers four ways to get the app; v0.9.1 and v0.9.2
        # each shipped one of them, and the table kept offering the other three
        # until someone clicked. This compares the two while both are in hand.
        #
        # A draft release is still a release as far as the API is concerned, so
        # this runs before publishing — which is the point. The step fails the
        # job, and the failure is a missing attachment rather than a 404 a
        # chemist finds a week later.
        #
        # `gh` needs the token explicitly here: `GITHUB_TOKEN` is not in the
        # environment of a step unless it is put there, and the runner's `gh`
        # has no other credentials.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-release-assets.mjs "${GITHUB_REF_NAME}"
