apply plugin: 'com.android.application'

/*
 * Release signing.
 *
 * Read from `android/keystore.properties`, which is gitignored along with the
 * keystore it names. Nothing secret is in this file, so it can be tracked and
 * reviewed — the credentials are the one thing that cannot be, and Gradle's
 * template puts them here.
 *
 * When the properties file is absent the release build type simply has no
 * signing config. That is deliberate rather than an error: a contributor
 * without the key can still build and test, and `assembleRelease` then produces
 * an unsigned APK that Android refuses to install. The alternative — failing
 * the configuration phase — would make the whole project unbuildable for
 * anyone who is not the release manager, which is worse than a late failure.
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.labcalc.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.labcalc.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * Both read from the repository's package.json rather than written here.
         *
         * Capacitor's template ships "1.0", which is a number that appears
         * nowhere else in the project — the APK would report a version the web
         * app, the desktop build and the release tag all disagree with. Read
         * from the same file they use, so there is one version and no checklist
         * item to forget.
         *
         * `versionCode` is not decoration: Android compares these integers to
         * decide whether an APK is an upgrade, and refuses one that is not
         * greater than the installed build. It was hard-coded to 1, so every
         * release after the first would have been rejected — with no error
         * shown, just an update that did not take. The mapping from the version
         * string lives in `src/ui/version.mjs`, which is unit-tested; the
         * script passes the result in.
         *
         * No default: if the property is missing the build fails loudly rather
         * than quietly shipping code 1 again.
         */
        versionCode project.hasProperty('appVersionCode') ? project.appVersionCode.toInteger() : 0
        versionName project.hasProperty('appVersion') ? project.appVersion : "0.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            /*
             * Signed with the release key when it is present, and otherwise left
             * unsigned so the build still runs. See the note above.
             */
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
